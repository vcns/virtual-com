# Keeps the pinned actions and the NuGet packages current, one grouped pull request per ecosystem. The Windows SDK and
# WDK (packages.config) are updated by hand, with Directory.Build.props.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories: ['/src/*', '/tests/*']
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
